; Vercel PHP runtime overrides.
; These directives are appended to the runtime php.ini by vercel-php at build time.

; Do not advertise the PHP version in the X-Powered-By response header.
expose_php = Off

; Never render errors to the client in production; keep them in the function logs.
display_errors = Off
log_errors = On

; PHP2Shell (CVE-2026-109618 / CVE-2026-109619) interim mitigation.
; The session upload progress handler is the documented trigger path for
; CVE-2026-109619, so it stays disabled even after the runtime is patched.
session.upload_progress.enabled = Off
session.upload_progress.cleanup = On

; Defence in depth: these are already off by default, but the runtime is
; user-supplied and must not silently re-enable them.
allow_url_include = Off
enable_dl = Off
